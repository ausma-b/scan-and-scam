<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scan &amp; Scam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Single deliberate look: a neon night street. Colours are painted explicitly so the page holds on any host theme. */
:root{
  --ink:#120a24; --night:#0b1440; --deep:#060a1f;
  --panel:#1c1245; --panel2:#2a1d66; --panel3:#352682;
  --pink:#ff4fa3; --teal:#2ee6d6; --yellow:#ffd23f; --orange:#ff8a3d; --violet:#9b6bff;
  --cream:#fff6e0; --paper:#fffdf6; --muted:#d6cff7;
  --right:#3ddc84; --wrong:#ff6b7f;
  --display:"Fredoka","Baloo 2","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",Arial,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--deep);color:var(--cream);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
#viewport{position:fixed;inset:0;overflow:hidden;background:var(--deep)}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(var(--s,0.5));transform-origin:center center;overflow:hidden;background:var(--night);font-size:26px;line-height:1.35}
#world{position:absolute;left:0;top:0;width:3840px;height:1080px;transform-origin:0 0;transition:transform 1.8s cubic-bezier(.65,0,.35,1);will-change:transform}
#world svg{display:block}
#shade{position:absolute;inset:0;background:rgba(6,10,31,.62);opacity:0;transition:opacity 1s ease;pointer-events:none}
#shade.on{opacity:1}
.visually-hidden{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shared pieces ---------- */
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.05;text-wrap:balance}
p{margin:0}
.sticker{background:var(--panel);border:5px solid var(--ink);border-radius:30px;box-shadow:12px 12px 0 var(--ink)}
.btn{font-family:var(--display);font-weight:600;font-size:34px;line-height:1;color:var(--ink);background:var(--yellow);border:5px solid var(--ink);border-radius:999px;padding:20px 40px;box-shadow:0 8px 0 var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:14px;transition:transform .12s ease, box-shadow .12s ease, background .2s}
.btn:hover{transform:translateY(-3px);box-shadow:0 11px 0 var(--ink)}
.btn:active{transform:translateY(6px);box-shadow:0 2px 0 var(--ink)}
.btn[disabled]{background:#8e88b3;cursor:not-allowed;transform:none;box-shadow:0 8px 0 var(--ink);opacity:.8}
.btn.pink{background:var(--pink)}
.btn.teal{background:var(--teal)}
.btn.ghost{background:var(--cream)}
.btn.small{font-size:26px;padding:14px 26px;box-shadow:0 6px 0 var(--ink)}
.btn svg{width:1em;height:1em;flex:none}
.key{display:inline-block;font-family:var(--display);font-weight:600;font-size:.8em;padding:1px 10px;border:3px solid currentColor;border-radius:10px;line-height:1.2}
button{font:inherit}
:focus-visible{outline:6px solid var(--teal);outline-offset:5px}
.paper :focus-visible{outline-color:#0a7d74}

/* ---------- top bar ---------- */
#topbar{position:absolute;left:0;right:0;top:0;height:104px;display:flex;align-items:center;gap:22px;padding:0 26px;background:var(--ink);border-bottom:5px solid #000;z-index:20}
.brand{font-family:var(--display);font-weight:700;font-size:40px;white-space:nowrap;color:var(--yellow);letter-spacing:.5px}
.brand span{color:var(--pink)}
.steps{display:flex;gap:8px;flex:1;min-width:0}
.step{font-family:var(--display);font-weight:600;font-size:22px;padding:8px 14px;border-radius:999px;border:4px solid #3c2f7a;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.step.on{background:var(--yellow);border-color:var(--yellow);color:var(--ink)}
.step.done{border-color:var(--teal);color:var(--teal)}
.step svg{width:22px;height:22px}
.chip{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:22px;padding:4px 18px;min-width:172px;background:var(--panel2);border:4px solid #3c2f7a}
.chip .lbl{font-size:18px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:700;line-height:1.1}
.chip .val{font-family:var(--display);font-weight:700;font-size:50px;line-height:1;font-variant-numeric:tabular-nums}
#timerChip.low .val{color:var(--pink);animation:pulse 1s infinite}
#timerChip.paused .val{color:var(--muted)}
#timerChip.off .val{color:var(--muted)}
#scoreChip .val{color:var(--yellow)}
#scoreChip{position:relative}
.plus{position:absolute;right:-6px;top:-10px;font-family:var(--display);font-weight:700;font-size:30px;color:var(--ink);background:var(--right);border:3px solid var(--ink);border-radius:999px;padding:0 12px;animation:floatUp 1.2s ease forwards;pointer-events:none}
.ctrls{display:flex;gap:8px}
.ctrl{width:92px;height:84px;border-radius:18px;border:4px solid #3c2f7a;background:var(--panel2);color:var(--cream);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:17px;font-weight:700;letter-spacing:.3px}
.ctrl svg{width:32px;height:32px}
.ctrl:hover{background:var(--panel3)}
.ctrl[aria-pressed="true"]{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}

/* ---------- screens ---------- */
.screen{position:absolute;left:0;right:0;top:104px;bottom:0;z-index:5}

/* intro */
.intro-card{position:absolute;left:56px;bottom:40px;width:1040px;padding:32px 44px 30px;display:flex;flex-direction:column;gap:18px}
.eyebrow{align-self:flex-start;font-family:var(--display);font-weight:600;font-size:24px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink);background:var(--teal);border:4px solid var(--ink);border-radius:999px;padding:6px 18px}
.intro-card h1{font-size:108px;color:var(--yellow);text-shadow:6px 6px 0 var(--pink),10px 10px 0 var(--ink);letter-spacing:1px}
.intro-card h1 .amp{color:var(--teal)}
.scenario{font-size:27px;line-height:1.42;max-width:62ch;color:var(--cream)}
.scenario strong{color:var(--yellow)}
.plan{display:flex;gap:10px;flex-wrap:wrap}
.plan div{font-size:21px;background:var(--panel2);border:4px solid #3c2f7a;border-radius:18px;padding:8px 16px}
.plan b{font-family:var(--display);color:var(--teal);font-weight:600}
.intro-row{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.keys{font-size:22px;color:var(--muted);display:flex;gap:18px;flex-wrap:wrap}

/* stage headers */
.stage-title{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.stage-title .num{font-family:var(--display);font-weight:700;font-size:28px;color:var(--ink);background:var(--pink);border:4px solid var(--ink);border-radius:14px;padding:2px 14px;transform:rotate(-4deg)}
.stage-title h2{font-size:54px;color:var(--yellow)}
.lead{font-size:26px;color:var(--muted)}

/* stage 1 */
.s1-grid{display:grid;grid-template-columns:720px 1fr;gap:28px;height:100%;padding:22px 30px 30px;box-sizing:border-box}
.s1-left{position:relative}
.s1-panel{display:flex;flex-direction:column;gap:16px;padding:24px 30px;min-height:0}
.pool{min-height:212px;display:flex;flex-wrap:wrap;gap:14px;align-content:flex-start;padding:16px;border-radius:22px;background:rgba(255,246,224,.06);border:4px dashed rgba(255,246,224,.4);box-sizing:border-box}
.pool:empty::before{content:"All sorted! Press Check answers.";font-size:26px;color:var(--muted);align-self:center;margin:auto}
.pool.checked{display:none}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:22px;flex:1;min-height:0}
.bin{display:flex;flex-direction:column;min-height:0;border:5px solid var(--ink);border-radius:26px;overflow:hidden;background:var(--panel2);box-shadow:8px 8px 0 var(--ink);transition:background .15s}
.bin-head{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:1px;text-transform:uppercase;border:0;border-bottom:5px solid var(--ink);padding:14px 18px;cursor:pointer;color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left}
.bin[data-zone="logged"] .bin-head{background:var(--teal)}
.bin[data-zone="not"] .bin-head{background:var(--pink)}
.bin-head .count{font-size:24px;background:var(--ink);color:var(--cream);border-radius:999px;padding:2px 14px}
.bin-body{flex:1;display:flex;flex-wrap:wrap;align-content:flex-start;gap:10px;padding:14px;overflow:auto;min-height:0}
.bin-body .card{font-size:23px;padding:7px 14px}
.zone.hover,.bin.hover{background:var(--panel3);outline:6px dashed var(--yellow);outline-offset:-6px}
.s1-actions{display:flex;align-items:center;gap:22px}
.s1-actions .hint{font-size:24px;color:var(--muted)}
.card{position:relative;font-family:var(--body);font-weight:700;font-size:25px;color:var(--ink);background:var(--cream);border:4px solid var(--ink);border-radius:18px;padding:10px 18px;box-shadow:0 6px 0 var(--ink);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;display:inline-flex;align-items:center;gap:10px;transition:transform .15s ease, background .25s, box-shadow .15s}
.card:hover{transform:translateY(-3px)}
.card.selected{background:var(--yellow);transform:translateY(-6px) rotate(-2deg);box-shadow:0 10px 0 var(--ink);outline:5px solid var(--pink);outline-offset:3px}
.card.dragging{opacity:.3}
.card.ghost{position:absolute;z-index:50;pointer-events:none;transform:rotate(-4deg) scale(1.06);box-shadow:10px 14px 0 rgba(18,10,36,.6);cursor:grabbing;margin:0}
.card .mark{display:none;width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);align-items:center;justify-content:center;flex:none;background:var(--cream)}
.card .mark svg{width:22px;height:22px}
.card.is-right{background:var(--right)}
.card.is-wrong{background:var(--wrong)}
.card.is-right .mark,.card.is-wrong .mark{display:inline-flex}
.card.is-wrong{animation:shake .5s ease 2}
.card .moved{display:none;font-size:18px;font-weight:700;background:var(--ink);color:var(--cream);border-radius:999px;padding:2px 10px}
.card.was-moved .moved{display:inline}
.checked .card{cursor:default}
.note{position:absolute;left:0;right:0;top:0;padding:26px 30px;background:var(--cream);color:var(--ink);animation:popIn .5s cubic-bezier(.2,1.4,.4,1)}
.note h3{font-size:44px;display:flex;align-items:center;gap:14px}
.note .tally{font-family:var(--display);font-weight:600;font-size:28px;margin:6px 0 14px;color:#6a1f5a}
.note ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.note li{display:flex;gap:14px;font-size:25px;line-height:1.35;align-items:flex-start}
.note li .ico{flex:none;width:48px;height:48px;border-radius:14px;border:4px solid var(--ink);display:flex;align-items:center;justify-content:center;background:var(--yellow)}
.note li:nth-child(2) .ico{background:var(--teal)}
.note li:nth-child(3) .ico{background:var(--pink)}
.note li .ico svg{width:28px;height:28px}
.tape{position:absolute;top:-18px;left:50%;width:150px;height:36px;margin-left:-75px;background:rgba(255,210,63,.85);border:3px solid var(--ink);transform:rotate(-3deg)}

/* stage 2 */
.s2-grid{display:grid;grid-template-columns:760px 1fr;gap:26px;height:100%;padding:18px 30px 30px;box-sizing:border-box}
.wheel-col{display:flex;flex-direction:column;align-items:center;gap:16px}
#wheel{width:660px;height:680px;filter:drop-shadow(10px 12px 0 rgba(18,10,36,.85))}
#wheel .pointer{transform-box:fill-box;transform-origin:50% 0}
#wheel .pointer.flick{animation:flick .12s ease}
.spin-row{display:flex;align-items:center;gap:20px}
.pips{display:flex;gap:10px}
.pip{width:26px;height:26px;border-radius:50%;border:4px solid var(--ink);background:var(--cream)}
.pip.used{background:var(--pink)}
.s2-panel{padding:28px 34px;display:flex;flex-direction:column;gap:16px;min-height:0;overflow:auto}
.scn-tag{align-self:flex-start;font-family:var(--display);font-weight:600;font-size:24px;letter-spacing:1px;text-transform:uppercase;color:var(--ink);border:4px solid var(--ink);border-radius:999px;padding:4px 16px}
.s2-panel h2{font-size:52px;color:var(--yellow)}
.story{font-size:27px;line-height:1.45;background:rgba(255,246,224,.08);border-left:8px solid var(--teal);padding:12px 18px;border-radius:0 16px 16px 0}
.qhead{display:flex;align-items:baseline;gap:16px}
.qcount{font-family:var(--display);font-weight:600;font-size:24px;color:var(--teal);white-space:nowrap}
.qhead h3{font-size:38px;color:var(--cream)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{font-family:var(--body);font-weight:700;font-size:25px;line-height:1.3;text-align:left;color:var(--ink);background:var(--cream);border:4px solid var(--ink);border-radius:20px;padding:14px 16px;box-shadow:0 6px 0 var(--ink);cursor:pointer;display:flex;align-items:center;gap:14px;transition:transform .12s, background .2s, opacity .2s}
.opt:hover:not([disabled]){transform:translateY(-3px);background:#fff}
.opt[disabled]{cursor:default}
.opt .k{flex:none;width:44px;height:44px;border-radius:12px;background:var(--ink);color:var(--cream);font-family:var(--display);font-weight:700;font-size:26px;display:flex;align-items:center;justify-content:center}
.opt .t{flex:1}
.opt .m{display:none;flex:none;align-items:center;gap:6px;font-size:18px;font-weight:700;background:var(--ink);color:var(--cream);border-radius:999px;padding:4px 10px 4px 6px;white-space:nowrap}
.opt .m svg{width:20px;height:20px}
.opt.is-right{background:var(--right)}
.opt.is-wrong{background:var(--wrong);animation:shake .45s ease}
.opt.is-right .m,.opt.is-wrong .m{display:inline-flex}
.opt.dim{opacity:.5}
.explain{display:flex;align-items:center;gap:20px}
.explain p{flex:1;font-size:25px;line-height:1.4;padding:14px 18px;border-radius:18px;border:4px solid var(--ink);background:var(--cream);color:var(--ink)}
.explain p b{font-family:var(--display);font-weight:700}
.idle{display:flex;flex-direction:column;gap:20px}
.idle .big{font-size:30px;line-height:1.45}
.done-list{display:flex;flex-direction:column;gap:12px;list-style:none;padding:0;margin:0}
.done-list li{display:flex;align-items:center;gap:14px;font-size:26px;background:rgba(255,246,224,.08);border-radius:16px;padding:10px 16px}
.dot{width:28px;height:28px;border-radius:50%;border:4px solid var(--ink);flex:none}
.done-list .sc{margin-left:auto;font-family:var(--display);font-weight:600;color:var(--yellow)}

/* stage 3 : clipboard */
.board-wrap{position:absolute;inset:14px 60px 26px;display:flex;justify-content:center}
.board{position:relative;width:100%;max-width:1760px;background:#b9793f;border:6px solid var(--ink);border-radius:40px;box-shadow:14px 14px 0 var(--ink);padding:54px 30px 28px;box-sizing:border-box;display:flex}
.clip{position:absolute;top:-30px;left:50%;width:320px;height:74px;margin-left:-160px;background:linear-gradient(#e8ecf5,#9aa3bd);border:6px solid var(--ink);border-radius:22px 22px 30px 30px}
.clip::after{content:"";position:absolute;left:50%;top:14px;width:90px;height:24px;margin-left:-45px;border-radius:14px;background:#5a6180;border:4px solid var(--ink)}
.paper{flex:1;background:var(--paper);color:var(--ink);border:5px solid var(--ink);border-radius:18px;padding:22px 30px;display:flex;flex-direction:column;gap:14px;min-height:0;background-image:repeating-linear-gradient(transparent 0 46px, rgba(46,120,230,.10) 46px 48px)}
.paper-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;border-bottom:4px solid var(--ink);padding-bottom:10px}
.paper-head h2{font-size:52px;color:var(--ink)}
.paper-head .meta{font-size:22px;color:#4a3f6b;text-align:right}
.paper-head .meta b{font-family:var(--display);font-size:30px;color:#a3185f}
.rgrid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:16px;min-height:0;overflow:auto;padding:4px}
.rbox{border:4px solid var(--ink);border-radius:20px;background:#fff;padding:14px 18px;display:flex;flex-direction:column;gap:8px}
.rbox-top{display:flex;align-items:center;gap:12px}
.rbox-top h3{font-size:30px;flex:1}
.rbox-top .sc{font-size:20px;font-weight:700;background:var(--ink);color:var(--cream);border-radius:999px;padding:3px 12px;white-space:nowrap}
.rbox label{font-size:22px;font-weight:700;color:#3b2f5c}
.rbox textarea{font-family:var(--body);font-size:24px;line-height:1.35;color:var(--ink);background:#fffef8;border:3px solid var(--ink);border-radius:14px;padding:10px 12px;resize:none;min-height:88px;flex:1}
.rbox textarea::placeholder{color:#6d6490}
.hint-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:44px}
.hint-btn{font-family:var(--display);font-weight:600;font-size:22px;background:var(--yellow);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:6px 16px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.hint-chip{font-size:21px;font-weight:700;background:#e6fbf8;border:3px solid #0a7d74;color:#064e48;border-radius:999px;padding:4px 14px;animation:popIn .35s ease both}
.rbox.surprise{background:#fff3fa}
.paper-actions{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.paper-actions .spacer{flex:1}

/* end */
.end-card{position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);width:1060px;padding:44px 56px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px;animation:popIn .6s cubic-bezier(.2,1.4,.4,1)}
.end-card h2{font-size:64px;color:var(--yellow)}
.final{font-family:var(--display);font-weight:700;font-size:150px;line-height:1;color:var(--cream);text-shadow:6px 6px 0 var(--pink),10px 10px 0 var(--ink)}
.final small{font-size:60px;color:var(--muted);text-shadow:none}
.rank{display:flex;align-items:center;gap:18px;font-family:var(--display);font-weight:700;font-size:50px;color:var(--ink);background:var(--teal);border:5px solid var(--ink);border-radius:999px;padding:10px 34px 10px 14px}
.rank svg{width:70px;height:70px}
.end-card .blurb{font-size:28px;max-width:44ch}
.end-row{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:6px}
#confetti{position:absolute;inset:0;pointer-events:none;z-index:40}

/* overlays */
.overlay{position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(6,10,31,.55)}
.dialog{padding:44px 56px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:22px;max-width:1100px;animation:popIn .45s cubic-bezier(.2,1.4,.4,1)}
.dialog h2{font-size:96px;color:var(--yellow);text-shadow:6px 6px 0 var(--pink),9px 9px 0 var(--ink)}
.dialog p{font-size:30px;max-width:40ch}
.dialog .row{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.dialog textarea{width:1000px;height:520px;font-family:var(--body);font-size:22px;border:4px solid var(--ink);border-radius:16px;padding:14px;color:var(--ink);background:var(--paper)}
.dialog.confirm h2{font-size:64px}
#toast{position:absolute;left:50%;bottom:38px;transform:translateX(-50%);z-index:70;font-family:var(--display);font-weight:600;font-size:30px;background:var(--cream);color:var(--ink);border:5px solid var(--ink);border-radius:999px;padding:12px 30px;box-shadow:0 8px 0 var(--ink);animation:popIn .3s ease}
#rotate{display:none}
@media (orientation:portrait) and (max-width:900px){#rotate{display:block;position:fixed;left:16px;right:16px;bottom:16px;z-index:100;background:var(--yellow);color:var(--ink);font:700 16px/1.3 var(--body);padding:12px 16px;border-radius:14px;border:3px solid var(--ink);text-align:center}}

/* scene ambience */
.neon.f1{animation:flicker 5s infinite}
.neon.f2{animation:flicker 7.3s infinite 1.2s}
.neon.f3{animation:flicker 4.1s infinite .6s}
.tw{animation:twinkle 1.6s ease-in-out infinite}
.tw.d1{animation-delay:.4s}.tw.d2{animation-delay:.8s}.tw.d3{animation-delay:1.2s}
.bob{animation:bob 1.3s ease-in-out infinite}
.sway{transform-box:fill-box;transform-origin:50% 0;animation:sway 3s ease-in-out infinite}
.beam{animation:scanbeam 1.6s ease-in-out infinite}
.flash{animation:camflash 2.6s steps(1) infinite}
.tail{transform-box:fill-box;transform-origin:0 0;animation:sway 2.4s ease-in-out infinite}
.dance{transform-box:fill-box;transform-origin:50% 100%;animation:dance 1s ease-in-out infinite}
.fall{transform-box:fill-box;transform-origin:50% 50%;animation:tumble 2.2s ease-in-out infinite}

@keyframes flicker{0%,17%,19%,21%,52%,54%,100%{opacity:1}18%,20%,53%{opacity:.3}}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.35}}

function awning(x, y, w, c1, c2){
  let g = "", n = Math.round(w / 44), sw = w / n;
  for (let i = 0; i < n; i++) g += `<rect x="${x + i*sw}" y="${y}" width="${sw}" height="46" fill="${i%2 ? c2 : c1}" stroke="none"/>`;
  g += `<rect x="${x}" y="${y}" width="${w}" height="46" fill="none"/>`;
  for (let i = 0; i < n; i++) g += `<path d="M${x + i*sw} ${y+46} a${sw/2} ${sw/2.6} 0 0 0 ${sw} 0 Z" fill="${i%2 ? c2 : c1}"/>`;
  return g;
}

      const cx = x + (i + 0.5) * w / n;
      g += `<rect x="${cx-40}" y="${wy}" width="80" height="${wh}" rx="8" fill="url(#win)"/><line x1="${cx-40}" y1="${wy+wh/2}" x2="${cx+40}" y2="${wy+wh/2}" stroke-width="4"/>`;

function palm(x, base, h, lean){

  g += `<path d="M${x} ${base} Q${x + lean*0.2} ${base - h*0.5} ${tx} ${ty}" stroke="#9a6440" stroke-width="28" fill="none"/>`;
  for (let i = 1; i < 9; i++) { const t = i/9, px = (1-t)*(1-t)*x + 2*(1-t)*t*(x+lean*0.2) + t*t*tx, py = (1-t)*(1-t)*base + 2*(1-t)*t*(base-h*0.5) + t*t*ty;

  return g;
}

function lights(x1, y1, x2, y2, sag, n){
  const cx = (x1+x2)/2, cy = (y1+y2)/2 + sag*2;
  let g = `<path d="M${x1} ${y1} Q${cx} ${cy} ${x2} ${y2}" fill="none" stroke="#0a0f2e" stroke-width="4"/>`;
  const cols = ["#ffd23f","#ff4fa3","#2ee6d6","#ff8a3d"];
  for (let i = 1; i < n; i++) { const t = i/n, px = (1-t)*(1-t)*x1 + 2*(1-t)*t*cx + t*t*x2, py = (1-t)*(1-t)*y1 + 2*(1-t)*t*cy + t*t*y2;
    g += `<circle class="tw d${i%4}" cx="${px}" cy="${py+8}" r="8" fill="${cols[i%4]}" stroke-width="3"/>`; }
  return g;
}

/* ================= VIEW / PAN ================= */
const VIEWS = {
  intro: {cx:1650, cy:540, z:1,    sx:960, sy:540},
  s1:    {cx:720,  cy:700, z:1.28, sx:380, sy:600},
  s2:    {cx:2000, cy:700, z:1.05, sx:420, sy:640},

  end:   {cx:1990, cy:540, z:1,    sx:960, sy:540}
};
function setView(key){
  const v = VIEWS[key], z = v.z;
  let tx = v.sx - v.cx * z, ty = v.sy - v.cy * z;
  tx = Math.min(0, Math.max(1920 - 3840 * z, tx));
  ty = Math.min(0, Math.max(1080 - 1080 * z, ty));
  $("#world").style.transform = `translate(${tx}px, ${ty}px) scale(${z})`;
  $("#shade").classList.toggle("on", key === "s3");
}

/* ================= STATE ================= */
let S;
function freshState(){

/* ================= FIT TO SCREEN ================= */
function fit(){
  const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  stageEl.style.setProperty("--s", s);
  S && (S.scale = s);
}
function toStage(clientX, clientY){
  const r = stageEl.getBoundingClientRect(), s = r.width / 1920;
  return { x: (clientX - r.left) / s, y: (clientY - r.top) / s, s };
}

/* ================= TIMER ================= */
const timer = { remaining:0, running:false, last:0, total:0, active:false };
function startTimer(sec){ timer.total = sec*1000; timer.remaining = sec*1000; timer.running = true; timer.active = true; timer.last = performance.now(); renderTimer(); }
function stopTimer(){ timer.running = false; timer.active = false; renderTimer(); }
setInterval(() => {
  const now = performance.now();
  if (timer.running && !S.paused) {
    timer.remaining -= now - timer.last;
    if (timer.remaining <= 0) { timer.remaining = 0; timer.running = false; renderTimer(); onTimesUp(); }
  }
  timer.last = now;
  renderTimer();
}, 200);
function fmt(ms){ const t = Math.ceil(ms/1000), m = Math.floor(t/60), s = t % 60; return m + ":" + String(s).padStart(2, "0"); }
function renderTimer(){
  const chip = $("#timerChip"), val = $("#timerVal"), lbl = $("#timerLbl");
  if (!timer.active) { val.textContent = S && S.stage === "intro" ? "~0:" + String(C.timings.intro).padStart(2,"0") : "–:––"; lbl.textContent = S && S.stage === "intro" ? "Briefing" : "Time"; chip.className = "chip off"; return; }
  val.textContent = fmt(timer.remaining);
  lbl.textContent = S.paused ? "Paused" : (S.stage === "s3" ? "Guide time" : "Time left");
  chip.className = "chip" + (S.paused ? " paused" : "") + (!S.paused && timer.remaining <= 10000 ? " low" : "");
}
function onTimesUp(){
  Sound.timesUp();
  const soft = S.stage === "s3";
  const box = $("#timesUp");
  const nextLabel = { s1: S.s1.checked ? "Continue to Stage 2" : "Reveal the answers", s2: "Continue to Stage 3", s3: "Finish the audit" }[S.stage] || "Continue";
  box.innerHTML = `<div class="dialog sticker" role="alertdialog" aria-labelledby="tuH"><h2 id="tuH">Time's up!</h2>
    <p>${soft ? "This one's only a guide. Take a little longer, or wrap up the report." : "Pens down, auditors. Ready to move on?"}</p>
    <div class="row"><button class="btn" id="tuGo" type="button">${nextLabel} ${I.arrow}</button>
    <button class="btn ghost" id="tuMore" type="button">Add ${C.timings.extendBy} seconds</button></div>
    <p style="font-size:22px;color:var(--muted)">Press <span class="key">Space</span> to continue</p></div>`;
  box.hidden = false;
  $("#tuGo").onclick = () => { hideTimesUp(); advance(); };
  $("#tuMore").onclick = () => { hideTimesUp(); timer.remaining += C.timings.extendBy * 1000; timer.running = true; timer.last = performance.now(); };
  setTimeout(() => { const b = $("#tuGo"); b && b.focus(); }, 30);
}
function hideTimesUp(){ $("#timesUp").hidden = true; $("#timesUp").innerHTML = ""; }

/* ================= TOP BAR ================= */
function renderTopbar(){
  const order = ["intro","s1","s2","s3"];
  const idx = S.stage === "end" ? 4 : order.indexOf(S.stage);
  const labels = { intro:"Brief", s1:"1 · Log", s2:"2 · Threats", s3:"3 · Report" };
  $("#steps").innerHTML = order.map((k,i) => {
    const cls = i === idx ? "on" : (i < idx ? "done" : "");
    return `<span class="step ${cls}" ${i === idx ? 'aria-current="step"' : ""}>${i < idx ? I.tick : ""}${labels[k]}</span>`;
  }).join("");
  $("#scoreVal").textContent = S.score;
  const p = $("#pauseBtn"); p.innerHTML = (S.paused ? I.play : I.pause) + `<span>${S.paused ? "Resume" : "Pause"}</span>`; p.setAttribute("aria-pressed", S.paused);
  $("#skipBtn").innerHTML = I.skip + "<span>Skip</span>"; $("#skipBtn").disabled = S.stage === "end";
  const m = $("#muteBtn"); m.innerHTML = (Sound.muted ? I.soundOff : I.soundOn) + `<span>${Sound.muted ? "Sound off" : "Sound on"}</span>`; m.setAttribute("aria-pressed", !Sound.muted);
  $("#restartBtn").innerHTML = I.restart + "<span>Restart</span>";
  renderTimer();
}
function addScore(n){
  if (!n) return;
  S.score += n; $("#scoreVal").textContent = S.score;
  const p = document.createElement("span"); p.className = "plus"; p.textContent = "+" + n;
  $("#scoreChip").appendChild(p); setTimeout(() => p.remove(), 1300);
}
function announce(t){ $("#live").textContent = t; }
let toastT;
function toast(t){ const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2600); }

/* ================= FLOW ================= */
function goStage(key){
  S.stage = key; hideTimesUp(); closeConfirm();
  $$(".screen").forEach(el => el.hidden = el.dataset.screen !== key);
  setView(key);
  ({ intro:buildIntro, s1:buildS1, s2:buildS2, s3:buildS3, end:buildEnd })[key]();
  const t = { s1:C.timings.stage1, s2:C.timings.stage2, s3:C.timings.stage3 }[key];
  if (t) startTimer(t); else stopTimer();
  if (key !== "end") stopConfetti();
  renderTopbar();
  announce(key === "end" ? "Audit complete" : (C.stageNames[key] || ""));
}
function advance(){
  if (S.stage === "intro") return goStage("s1");
  if (S.stage === "s1") { if (!S.s1.checked) return checkS1(); return goStage("s2"); }
  if (S.stage === "s2") { if (S.s2.spinning) return; return goStage("s3"); }
  if (S.stage === "s3") return goStage("end");
}
function restart(){ closeConfirm(); stopConfetti(); S = freshState(); goStage("intro"); }

/* ================= INTRO ================= */
function buildIntro(){
  $("#scr-intro").innerHTML = `<div class="intro-card sticker">

    <div class="intro-row"><button class="btn pink" id="startBtn" type="button">Start audit ${I.arrow}</button>

/* ================= STAGE 1 ================= */
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function buildS1(){
  const st = S.s1;
  C.stage1.cards.forEach(c => st.place[c.id] = "pool");
  const cards = shuffle(C.stage1.cards).map(c => `<button class="card" type="button" data-id="${c.id}" aria-pressed="false"><span class="mark" aria-hidden="true"></span><span class="txt">${esc(c.text)}</span><span class="moved">moved</span><span class="visually-hidden sr"></span></button>`).join("");
  $("#scr-s1").innerHTML = `<div class="s1-grid">
    <div class="s1-left" id="s1Left"></div>
    <div class="s1-panel sticker" id="s1Panel">
      <div class="stage-title"><span class="num">Stage 1</span><h2>${esc(C.stageNames.s1)}</h2></div>
      <p class="lead">${esc(C.stage1.instruction)}</p>
      <div class="pool zone" data-zone="pool" id="pool" aria-label="Unsorted cards">${cards}</div>
      <div class="bins">
        ${["logged","not"].map(z => `<section class="bin zone" data-zone="${z}"><button class="bin-head" type="button" data-zone-btn="${z}"><span>${esc(C.stage1.bins[z])}</span><span class="count" data-count="${z}">0</span></button><div class="bin-body" data-body="${z}"></div></section>`).join("")}
      </div>
      <div class="s1-actions"><button class="btn pink" id="checkBtn" type="button">Check answers</button><span class="hint" id="s1Hint">+${C.points.card} points per correct card</span></div>
    </div></div>`;
  wireS1();
}
function zoneBody(z){ return z === "pool" ? $("#pool") : $(`[data-body="${z}"]`); }
function cardEl(id){ return $(`#scr-s1 .card[data-id="${id}"]`); }
function updateCounts(){ ["logged","not"].forEach(z => { const el = $(`[data-count="${z}"]`); if (el) el.textContent = Object.values(S.s1.place).filter(v => v === z).length; }); }
function select(id){
  const st = S.s1; if (st.checked) return;
  st.selected = st.selected === id ? null : id;
  $$("#scr-s1 .card").forEach(c => { const on = c.dataset.id === st.selected; c.classList.toggle("selected", on); c.setAttribute("aria-pressed", on); });
  if (st.selected) { Sound.pop(); $("#s1Hint").textContent = "Now tap a bin to drop it in."; }
  else $("#s1Hint").textContent = `+${C.points.card} points per correct card`;
}
function moveCard(id, zone, silent){
  const st = S.s1; st.place[id] = zone;
  const el = cardEl(id); zoneBody(zone).appendChild(el);
  if (!silent) Sound.pop();
  st.selected = null; $$("#scr-s1 .card").forEach(c => { c.classList.remove("selected"); c.setAttribute("aria-pressed", "false"); });
  updateCounts();
  if (!st.checked) $("#s1Hint").textContent = Object.values(st.place).includes("pool") ? `+${C.points.card} points per correct card` : "All sorted. Check your answers!";
}
let drag = null, justDragged = false;
function wireS1(){
  const scr = $("#scr-s1");
  scr.addEventListener("click", e => {
    if (S.s1.checked) return;
    const card = e.target.closest(".card");
    if (card) { if (justDragged) return; select(card.dataset.id); return; }
    const zb = e.target.closest("[data-zone-btn]"), zone = zb ? zb.dataset.zoneBtn : (e.target.closest(".zone") && e.target.closest(".zone").dataset.zone);
    if (zone && S.s1.selected) moveCard(S.s1.selected, zone);
  });
  $("#checkBtn").onclick = () => { if (S.s1.checked) goStage("s2"); else checkS1(); };
  $$("#scr-s1 .card").forEach(card => {
    card.addEventListener("pointerdown", e => {
      if (S.s1.checked || (e.button && e.button !== 0)) return;
      const p = toStage(e.clientX, e.clientY), r = card.getBoundingClientRect(), s = p.s;
      drag = { id: card.dataset.id, el: card, sx: e.clientX, sy: e.clientY, ox: (e.clientX - r.left)/s, oy: (e.clientY - r.top)/s, moved: false, ghost: null, pid: e.pointerId, hover: null };
      try { card.setPointerCapture(e.pointerId); } catch(err) {}
    });
    card.addEventListener("pointermove", e => {
      if (!drag || drag.el !== card) return;
      if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 8) return;
      if (!drag.moved) {
        drag.moved = true;
        const g = card.cloneNode(true); g.classList.add("ghost"); g.classList.remove("selected"); g.removeAttribute("id"); g.setAttribute("aria-hidden", "true");
        stageEl.appendChild(g); drag.ghost = g; card.classList.add("dragging");
      }
      const p = toStage(e.clientX, e.clientY);
      drag.ghost.style.left = (p.x - drag.ox) + "px"; drag.ghost.style.top = (p.y - drag.oy) + "px";
      const hit = document.elementFromPoint(e.clientX, e.clientY), z = hit && hit.closest && hit.closest(".zone");
      if (drag.hover !== z) { drag.hover && drag.hover.classList.remove("hover"); z && z.classList.add("hover"); drag.hover = z; }
      e.preventDefault();
    });
    const end = e => {
      if (!drag || drag.el !== card) return;
      const d = drag; drag = null;
      if (d.moved) {
        d.ghost && d.ghost.remove(); card.classList.remove("dragging"); d.hover && d.hover.classList.remove("hover");
        const zone = d.hover && d.hover.dataset.zone;
        if (zone && e.type === "pointerup") moveCard(d.id, zone);
        justDragged = true; setTimeout(() => justDragged = false, 80);
      }
    };
    card.addEventListener("pointerup", end); card.addEventListener("pointercancel", end);
  });
}
function checkS1(){
  const st = S.s1; if (st.checked) return;
  st.checked = true; st.selected = null;
  $("#pool").classList.add("checked"); $("#s1Panel").classList.add("checked");
  let correct = 0;
  C.stage1.cards.forEach(c => {
    const el = cardEl(c.id), want = c.logged ? "logged" : "not", ok = st.place[c.id] === want;
    st.initial[c.id] = st.place[c.id];
    el.classList.remove("selected"); el.setAttribute("aria-pressed","false");
    el.classList.add(ok ? "is-right" : "is-wrong");
    el.querySelector(".mark").innerHTML = ok ? I.tick : I.cross;
    el.querySelector(".sr").textContent = ok ? " (correct)" : ` (incorrect, belongs in ${C.stage1.bins[want]})`;
    if (ok) correct++;
    else setTimeout(() => { moveCard(c.id, want, true); el.classList.add("was-moved"); }, 1100);
  });
  st.correct = correct;
  correct ? Sound.good() : Sound.bad();
  addScore(correct * C.points.card);
  const btn = $("#checkBtn"); btn.innerHTML = `On to the Threat Wheel ${I.arrow}`; btn.classList.remove("pink");
  $("#s1Hint").textContent = `${correct} of ${C.stage1.cards.length} correct`;
  setTimeout(() => {
    const icons = [I.search, I.bin, I.lock];
    $("#s1Left").innerHTML = `<div class="note sticker" role="region" aria-label="Auditor's note"><span class="tape" aria-hidden="true"></span>
      <h3>Auditor's note</h3><p class="tally">You sorted ${correct} of ${C.stage1.cards.length} correctly · +${correct * C.points.card} points</p>
      <ul>${C.stage1.auditorNote.map((f,i) => `<li><span class="ico">${icons[i % 3]}</span><span>${esc(f)}</span></li>`).join("")}</ul></div>`;
    btn.focus();
  }, 1300);
  announce(`${correct} of ${C.stage1.cards.length} correct`);
}

/* ================= STAGE 2 ================= */
function wheelSVG(){
  const n = SCN.length, c = 330, r = 300, seg = 360 / n;
  const pt = a => { const rad = (a - 90) * Math.PI / 180; return (c + r * Math.cos(rad)).toFixed(2) + " " + (c + r * Math.sin(rad)).toFixed(2); };
  let segs = "", shades = "", labels = "", pegs = "";
  SCN.forEach((sc, i) => {
    const d = `M${c} ${c} L${pt(i*seg)} A${r} ${r} 0 0 1 ${pt((i+1)*seg)} Z`;
    segs += `<path d="${d}" fill="${sc.color}" stroke="${INK}" stroke-width="5"/>`;
    shades += `<path class="shade" data-i="${i}" d="${d}" fill="${INK}" fill-opacity=".62" visibility="hidden"/>`;
    const mid = i*seg + seg/2, lines = sc.wheelLabel;
    labels += `<g transform="rotate(${mid} ${c} ${c})"><text x="${c}" y="${c - r*0.66}" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="700" font-size="30" fill="${INK}">${lines.map((l,j) => `<tspan x="${c}" dy="${j ? 32 : 0}">${esc(l)}</tspan>`).join("")}</text>
      <g class="done" data-i="${i}" visibility="hidden"><rect x="${c-54}" y="${c - r*0.66 + 44}" width="108" height="36" rx="18" fill="#fff6e0" stroke="${INK}" stroke-width="4"/><text x="${c}" y="${c - r*0.66 + 70}" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="700" font-size="22" fill="${INK}">DONE</text></g></g>`;
    const b = (i*seg - 90) * Math.PI / 180;
    pegs += `<circle cx="${(c + (r-8)*Math.cos(b)).toFixed(1)}" cy="${(c + (r-8)*Math.sin(b)).toFixed(1)}" r="9" fill="#fff6e0" stroke="${INK}" stroke-width="4"/>`;
  });
  let bulbs = "";
  for (let i = 0; i < 24; i++) { const a = (i*15) * Math.PI / 180; bulbs += `<circle class="tw d${i%2*2}" cx="${(c + (r+16)*Math.cos(a)).toFixed(1)}" cy="${(c + (r+16)*Math.sin(a)).toFixed(1)}" r="6" fill="#fff4a8"/>`; }
  return `<svg id="wheel" viewBox="-10 -30 680 700" role="img" aria-label="Threat wheel with ${n} scenarios">
    <circle cx="${c}" cy="${c}" r="${r+28}" fill="${INK}"/><circle cx="${c}" cy="${c}" r="${r+22}" fill="#3a2a80"/>${bulbs}
    <g id="wheelRot" transform="rotate(0 ${c} ${c})">${segs}${shades}${labels}${pegs}</g>
    <circle cx="${c}" cy="${c}" r="62" fill="#ffd23f" stroke="${INK}" stroke-width="6"/><text x="${c}" y="${c+12}" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="700" font-size="34" fill="${INK}">SPIN</text>
    <path class="pointer" d="M${c-34} -24 L${c+34} -24 L${c} 56 Z" fill="#ff4fa3" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/>
  </svg>`;
}
function buildS2(){
  $("#scr-s2").innerHTML = `<div class="s2-grid">
    <div class="wheel-col">${wheelSVG()}
      <div class="spin-row"><button class="btn pink" id="spinBtn" type="button">Spin the wheel</button><div class="pips" id="pips" aria-hidden="true"></div></div>
    </div>
    <div class="s2-panel sticker" id="s2Panel" aria-live="polite"></div></div>`;
  $("#spinBtn").onclick = spin;
  // restore rotation / done markers (if rebuilt)
  $("#wheelRot").setAttribute("transform", `rotate(${S.s2.rotation} 330 330)`);
  S.s2.spun.forEach(markDone);
  renderSpin(); renderS2Idle();
}
function spinsLeft(){ return SPINS - S.s2.spun.length; }
function renderSpin(){
  const b = $("#spinBtn"); if (!b) return;
  const st = S.s2, left = spinsLeft();
  b.disabled = st.spinning || st.current !== null || left <= 0;
  b.textContent = st.spinning ? "Spinning…" : (left <= 0 ? "All spins done" : `Spin ${st.spun.length + 1} of ${SPINS}`);
  $("#pips").innerHTML = Array.from({length: SPINS}, (_, i) => `<span class="pip ${i < st.spun.length ? "used" : ""}"></span>`).join("");
}
function markDone(i){ $$(`#wheel [data-i="${i}"]`).forEach(el => el.setAttribute("visibility", "visible")); }
function scenarioScore(i){ return S.s2.answers.filter(a => a.scn === i && a.right).length; }
function renderS2Idle(){
  const st = S.s2, left = spinsLeft(), panel = $("#s2Panel");
  let h = `<div class="stage-title"><span class="num">Stage 2</span><h2>${esc(C.stageNames.s2)}</h2></div>`;
  if (!st.spun.length) {
    h += `<div class="idle"><p class="big">Each slice is a way offenders could target the precinct's ID scanners. Spin to reveal a threat, then answer three quick questions as a class:</p>
      <ul class="done-list">${C.stage2.prompts.map((p,i) => `<li><span class="dot" style="background:${["#ffd23f","#2ee6d6","#ff4fa3"][i]}"></span>${esc(p)}</li>`).join("")}</ul>
      <p class="lead">${SPINS} spins · +${C.points.question} points per correct answer · no repeats</p></div>`;
  } else {
    const last = st.spun[st.spun.length - 1];
    h += `<div class="idle"><p class="big">${left ? `Threat mapped! <b style="color:var(--yellow)">${scenarioScore(last)} of 3</b> correct on “${esc(SCN[last].title)}”. Spin again for the next one.` : "All threats mapped. Time to write the audit report."}</p>
      <ul class="done-list">${st.spun.map(i => `<li><span class="dot" style="background:${SCN[i].color}"></span>${esc(SCN[i].title)}<span class="sc">${scenarioScore(i)} / 3</span></li>`).join("")}</ul>
      ${left ? "" : `<div><button class="btn" id="toS3" type="button">Write the audit report ${I.arrow}</button></div>`}</div>`;
  }
  panel.innerHTML = h;
  const b = $("#toS3"); if (b) { b.onclick = () => goStage("s3"); b.focus(); }
}
function spin(){
  const st = S.s2;
  if (st.spinning || st.current !== null || spinsLeft() <= 0) return;
  Sound.ensure();
  const avail = SCN.map((_, i) => i).filter(i => !st.spun.includes(i));
  const k = avail[Math.floor(Math.random() * avail.length)];
  const seg = 360 / SCN.length, jitter = (Math.random() - 0.5) * seg * 0.6;
  const targetMod = ((360 - (k*seg + seg/2 + jitter)) % 360 + 360) % 360;
  const cur = st.rotation, curMod = ((cur % 360) + 360) % 360;
  let delta = targetMod - curMod; if (delta < 0) delta += 360;
  const end = cur + 360 * 5 + delta, dur = C.stage2.spinSeconds * 1000 * (reduced ? 0.4 : 1);
  st.spinning = true; renderSpin();
  const rot = $("#wheelRot"), pointer = $("#wheel .pointer");
  const t0 = performance.now(); let lastSeg = Math.floor(cur / seg);
  const frame = t => {
    if (S.stage !== "s2" || !document.body.contains(rot)) { st.spinning = false; return; }
    const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 4), r = cur + (end - cur) * e;
    rot.setAttribute("transform", `rotate(${r.toFixed(2)} 330 330)`);
    const sg = Math.floor(r / seg);
    if (sg !== lastSeg) { lastSeg = sg; Sound.tick(); pointer.classList.remove("flick"); void pointer.getBoundingClientRect(); pointer.classList.add("flick"); }
    if (p < 1) requestAnimationFrame(frame);
    else { st.rotation = end; st.spinning = false; landed(k); }
  };
  requestAnimationFrame(frame);
}
function landed(k){
  const st = S.s2;
  st.spun.push(k); st.current = k; st.qi = 0; st.answered = false;
  st.order = SCN[k].questions.map(q => C.stage2.shuffleOptions ? shuffle(q.options.map((_, i) => i)) : q.options.map((_, i) => i));
  markDone(k); Sound.land(); renderSpin(); renderQuestion();
  announce(`Landed on ${SCN[k].title}`);
}
function renderQuestion(){
  const st = S.s2, sc = SCN[st.current], q = sc.questions[st.qi], order = st.order[st.qi];
  const prompt = q.prompt || C.stage2.prompts[st.qi] || "";
  $("#s2Panel").innerHTML = `<span class="scn-tag" style="background:${sc.color}">Threat ${st.spun.length} of ${SPINS} · ${esc(sc.wheelLabel.join(" "))}</span>
    <h2>${esc(sc.title)}</h2>
    <p class="story">${esc(sc.story)}</p>
    <div class="qhead"><span class="qcount">Q${st.qi + 1} of ${sc.questions.length}</span><h3>${esc(prompt)}</h3></div>
    <div class="opts" role="group" aria-label="${esc(prompt)}">${order.map((oi, pos) => `<button class="opt" type="button" data-pos="${pos}"><span class="k">${pos + 1}</span><span class="t">${esc(q.options[oi])}</span><span class="m"></span></button>`).join("")}</div>
    <div class="explain" id="explain" hidden></div>`;
  $$("#s2Panel .opt").forEach(b => b.onclick = () => answer(+b.dataset.pos));
}
function answer(pos){
  const st = S.s2; if (st.current === null || st.answered) return;
  const sc = SCN[st.current], q = sc.questions[st.qi], order = st.order[st.qi];
  if (pos < 0 || pos >= order.length) return;
  st.answered = true;
  const chosen = order[pos], right = chosen === q.correct;
  st.answers.push({ scn: st.current, qi: st.qi, prompt: q.prompt || C.stage2.prompts[st.qi], chosen: q.options[chosen], correct: q.options[q.correct], right });
  $$("#s2Panel .opt").forEach(b => {
    const oi = order[+b.dataset.pos]; b.disabled = true;
    if (oi === q.correct) { b.classList.add("is-right"); b.querySelector(".m").innerHTML = I.tick + (right ? "Correct" : "Right answer"); }
    else if (+b.dataset.pos === pos) { b.classList.add("is-wrong"); b.querySelector(".m").innerHTML = I.cross + "Your pick"; }
    else b.classList.add("dim");
  });
  if (right) { Sound.good(); addScore(C.points.question); } else Sound.bad();
  const last = st.qi >= sc.questions.length - 1;
  const nextTxt = !last ? "Next question" : (spinsLeft() > 0 ? "Back to the wheel" : "See results");
  const ex = $("#explain"); ex.hidden = false;
  ex.innerHTML = `<p><b>${right ? "Correct!" : "Not quite."}</b> ${esc(q.explanation)}</p><button class="btn" id="nextQ" type="button">${nextTxt} ${I.arrow}</button>`;
  $("#nextQ").onclick = nextQuestion; $("#nextQ").focus();
  announce(right ? "Correct" : "Incorrect. The answer is " + q.options[q.correct]);
}
function nextQuestion(){
  const st = S.s2; if (!st.answered) return;
  const sc = SCN[st.current];
  if (st.qi < sc.questions.length - 1) { st.qi++; st.answered = false; renderQuestion(); }
  else { st.current = null; st.answered = false; renderSpin(); renderS2Idle(); const b = $("#spinBtn"); if (b && !b.disabled) b.focus(); }
}

/* ================= STAGE 3 ================= */
function buildS3(){
  const st = S.s3, spun = S.s2.spun;
  const boxes = spun.map(i => {
    const sc = SCN[i], shown = st.hints[sc.id];
    return `<div class="rbox"><div class="rbox-top"><span class="dot" style="background:${sc.color}"></span><h3>${esc(sc.title)}</h3><span class="sc">${scenarioScore(i)}/3 correct</span></div>
      <label for="strat-${sc.id}">${esc(C.stage3.strategyPrompt)}</label>
      <textarea id="strat-${sc.id}" data-scn="${sc.id}" rows="3" placeholder="e.g. who should do what, and how would it stop the offender?">${esc(st.strat[sc.id] || "")}</textarea>
      <div class="hint-row" id="hints-${sc.id}">${shown ? hintChips(sc) : `<button class="hint-btn" type="button" data-hint="${sc.id}">${esc(C.stage3.hintLabel)}</button>`}</div></div>`;
  }).join("");
  const none = spun.length ? "" : `<div class="rbox"><h3>No threats spun this round</h3><p style="font-size:24px">Skip back with <span class="key">R</span> to restart, or jot general prevention ideas in the box.</p></div>`;
  $("#scr-s3").innerHTML = `<div class="board-wrap"><div class="board"><span class="clip" aria-hidden="true"></span><div class="paper">
    <div class="paper-head"><div class="stage-title"><span class="num">Stage 3</span><h2>${esc(C.stageNames.s3)}</h2></div>
      <div class="meta">${esc(dateStr())}<br>Team score <b>${S.score}</b> / ${MAX_SCORE}</div></div>
    <div class="rgrid">${boxes}${none}
      <div class="rbox surprise"><div class="rbox-top"><h3>${esc(C.stage3.surprisePrompt)}</h3></div>
      <label for="surprise" class="visually-hidden">${esc(C.stage3.surprisePrompt)}</label>
      <textarea id="surprise" rows="3" placeholder="e.g. we didn't know the data is deleted after 30 days…">${esc(st.surprise)}</textarea></div>
    </div>
    <div class="paper-actions">
      <button class="btn teal small" id="copyBtn" type="button">${I.copy} Copy .txt</button>
      <span class="spacer"></span>
      <button class="btn pink" id="finishBtn" type="button">Finish audit ${I.arrow}</button>
    </div></div></div></div>`;
  const scr = $("#scr-s3");
  scr.addEventListener("input", e => {
    if (e.target.id === "surprise") st.surprise = e.target.value;
    else if (e.target.dataset.scn) st.strat[e.target.dataset.scn] = e.target.value;
  });
  scr.addEventListener("click", e => {
    const hb = e.target.closest("[data-hint]"); if (!hb) return;
    const sc = SCN.find(s => s.id === hb.dataset.hint); st.hints[sc.id] = true;
    $("#hints-" + sc.id).innerHTML = hintChips(sc); Sound.pop();
  });
  $("#copyBtn").onclick = copyReport;
  $("#finishBtn").onclick = () => goStage("end");
}
function hintChips(sc){ return `<span style="font-size:20px;font-weight:700;color:#3b2f5c">Think about:</span>` + sc.hints.map((h,i) => `<span class="hint-chip" style="animation-delay:${i*0.12}s">${esc(h)}</span>`).join(""); }

/* ================= REPORT ================= */
function dateStr(){ try { return new Date().toLocaleString("en-AU", { weekday:"short", day:"numeric", month:"long", year:"numeric", hour:"numeric", minute:"2-digit" }); } catch(e) { return new Date().toString(); } }
function rankFor(score){ const pct = score / MAX_SCORE; let r = C.ranks[0]; C.ranks.forEach(x => { if (pct >= x.min) r = x; }); return r; }
function buildReport(){
  const L = [], rule = "-".repeat(56), rank = rankFor(S.score);
  L.push("SCAN & SCAM: ID SCANNER SAFETY AUDIT", C.location, "Date: " + dateStr(), `Final score: ${S.score} / ${MAX_SCORE} (${rank.title})`, "");
  L.push(rule, "STAGE 1 · " + C.stageNames.s1.toUpperCase(), rule);
  if (S.s1.skipped) L.push("Skipped.");
  else if (S.s1.checked) {
    L.push(`Cards sorted correctly: ${S.s1.correct} / ${C.stage1.cards.length}`);
    C.stage1.cards.forEach(c => { const want = c.logged ? "logged" : "not", got = S.s1.initial[c.id];
      L.push(`  [${got === want ? "correct" : "wrong"}] ${c.text}: ${C.stage1.bins[want]}${got === want ? "" : ` (we said: ${got === "pool" ? "left unsorted" : C.stage1.bins[got]})`}`); });
  } else L.push("Not checked.");
  L.push("", rule, "STAGE 2 · " + C.stageNames.s2.toUpperCase(), rule);
  if (!S.s2.spun.length) L.push("No scenarios spun.");
  S.s2.spun.forEach((i, n) => {
    const sc = SCN[i]; L.push(`${n+1}. ${sc.title} (${sc.wheelLabel.join(" ")}): ${scenarioScore(i)}/3 correct`, `   ${sc.story}`);
    S.s2.answers.filter(a => a.scn === i).forEach(a => {
      L.push(`   Q${a.qi+1} ${a.prompt}`, `      Our answer: ${a.chosen} [${a.right ? "correct" : "wrong"}]`);
      if (!a.right) L.push(`      Correct answer: ${a.correct}`);
    });
    L.push("");
  });
  L.push(rule, "STAGE 3 · " + C.stageNames.s3.toUpperCase(), rule);
  S.s2.spun.forEach((i, n) => { const sc = SCN[i]; L.push(`${n+1}. ${sc.title}: ${C.stage3.strategyPrompt}`, "   " + ((S.s3.strat[sc.id] || "").trim() || "(no answer)"), ""); });
  L.push(C.stage3.surprisePrompt + ":", "   " + (S.s3.surprise.trim() || "(no answer)"), "");
  return L.join("\n");
}
async function copyReport(){
  const text = buildReport();
  try { await navigator.clipboard.writeText(text); toast("Report copied to clipboard"); return; } catch(e) {}
  try {
    const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand("copy"); ta.remove();
    if (ok) { toast("Report copied to clipboard"); return; }
  } catch(e) {}
  showCopyBox(text, "Copy the report");
}
function showCopyBox(text, title){
  const box = $("#copyBox");
  box.innerHTML = `<div class="dialog sticker" role="dialog" aria-labelledby="cbH"><h2 id="cbH" style="font-size:52px;text-shadow:none">${esc(title)}</h2><p style="font-size:24px">Your browser blocked automatic copying here. The report is selected below: press Ctrl+C (or ⌘C).</p><textarea id="cbText" readonly>${esc(text)}</textarea><button class="btn" id="cbClose" type="button">Done</button></div>`;
  box.hidden = false; const ta = $("#cbText"); ta.focus(); ta.select();
  $("#cbClose").onclick = () => { box.hidden = true; box.innerHTML = ""; };
}
/* ================= END ================= */
function badge(){ return `<svg viewBox="0 0 70 70" aria-hidden="true"><circle cx="35" cy="35" r="31" fill="#ffd23f" stroke="${INK}" stroke-width="5"/><path d="M35 14l6 13 14 2-10 10 3 14-13-7-13 7 3-14-10-10 14-2z" fill="#ff4fa3" stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/></svg>`; }
function buildEnd(){
  const rank = rankFor(S.score);
  $("#scr-end").innerHTML = `<div class="end-card sticker">
    <h2>Audit complete!</h2>
    <div class="final" aria-label="Final score ${S.score} out of ${MAX_SCORE}">${S.score}<small> / ${MAX_SCORE}</small></div>
    <div class="rank">${badge()}${esc(rank.title)}</div>
    <p class="blurb">${esc(rank.blurb)}</p>
    <div class="end-row"><button class="btn pink" id="againBtn" type="button">${I.restart} Play again</button>
    <button class="btn teal small" id="copyBtn2" type="button">${I.copy} Copy .txt</button></div></div>`;
  $("#againBtn").onclick = restart; $("#copyBtn2").onclick = copyReport;
  Sound.fanfare(); startConfetti();
  setTimeout(() => { const b = $("#againBtn"); b && b.focus(); }, 50);
}

/* ================= CONFETTI ================= */
let confRAF = null;
function startConfetti(){
  const cv = $("#confetti"), ctx = cv.getContext("2d"), cols = ["#ff4fa3","#2ee6d6","#ffd23f","#ff8a3d","#9b6bff","#fff6e0"];
  const n = reduced ? 60 : 220, parts = [];
  for (let i = 0; i < n; i++) parts.push({ x: Math.random()*1920, y: -Math.random()*900, w: 10 + Math.random()*12, h: 14 + Math.random()*16, vy: 3 + Math.random()*5, vx: -2 + Math.random()*4, r: Math.random()*6, vr: -0.15 + Math.random()*0.3, c: cols[i % cols.length] });
  const t0 = performance.now();
  cancelAnimationFrame(confRAF);
  const step = t => {
    ctx.clearRect(0, 0, 1920, 1080);
    const alive = t - t0 < 6500;
    parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += p.vr; if (p.y > 1100 && alive) { p.y = -20; p.x = Math.random()*1920; }
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h); ctx.strokeRect(-p.w/2, -p.h/2, p.w, p.h); ctx.restore(); });
    if (alive || parts.some(p => p.y < 1100)) confRAF = requestAnimationFrame(step); else ctx.clearRect(0, 0, 1920, 1080);
  };
  confRAF = requestAnimationFrame(step);
}
function stopConfetti(){ cancelAnimationFrame(confRAF); const cv = $("#confetti"); cv.getContext("2d").clearRect(0, 0, 1920, 1080); }

/* ================= CONFIRM RESTART ================= */
function openConfirm(){
  const box = $("#confirmBox");
  box.innerHTML = `<div class="dialog sticker confirm" role="alertdialog" aria-labelledby="crH"><h2 id="crH">Restart the game?</h2><p>The score and report will be cleared.</p>
    <div class="row"><button class="btn pink" id="crYes" type="button">${I.restart} Restart <span class="key">R</span></button><button class="btn ghost" id="crNo" type="button">Keep playing <span class="key">Esc</span></button></div></div>`;
  box.hidden = false; $("#crYes").onclick = restart; $("#crNo").onclick = closeConfirm; $("#crNo").focus();
}
function closeConfirm(){ const b = $("#confirmBox"); b.hidden = true; b.innerHTML = ""; }

/* ================= KEYBOARD ================= */
function primary(){
  if (!$("#timesUp").hidden) { hideTimesUp(); return advance(); }
  const st = S.stage;
  if (st === "intro") return goStage("s1");
  if (st === "s1") return S.s1.checked ? goStage("s2") : checkS1();
  if (st === "s2") {
    const s2 = S.s2; if (s2.spinning) return;
    if (s2.current !== null) { if (s2.answered) nextQuestion(); else toast("Pick an answer: press 1–4"); return; }
    if (spinsLeft() > 0) return spin();
    return goStage("s3");
  }
  if (st === "s3") return goStage("end");
}
document.addEventListener("keydown", e => {
  const tag = (e.target && e.target.tagName) || "";
  if (tag === "TEXTAREA" || tag === "INPUT") { if (e.key === "Escape") e.target.blur(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (!$("#copyBox").hidden) { if (e.key === "Escape") { $("#copyBox").hidden = true; } return; }
  if (!$("#confirmBox").hidden) {
    if (e.code === "KeyR") { e.preventDefault(); restart(); }
    else if (e.key === "Escape") closeConfirm();
    return;
  }
  if (e.code === "Space") { e.preventDefault(); if (!e.repeat) primary(); return; }
  if (e.code === "KeyP") { togglePause(); return; }
  if (e.code === "KeyR") { openConfirm(); return; }
  if (e.code === "KeyM") { toggleMute(); return; }
  if (S.stage === "s2" && S.s2.current !== null && !S.s2.answered) {
    const map = { Digit1:0, Digit2:1, Digit3:2, Digit4:3, Numpad1:0, Numpad2:1, Numpad3:2, Numpad4:3, KeyA:0, KeyB:1, KeyC:2, KeyD:3 };
    if (e.code in map) answer(map[e.code]);
  }
});
function togglePause(){ S.paused = !S.paused; timer.last = performance.now(); renderTopbar(); toast(S.paused ? "Timer paused" : "Timer running"); }
function toggleMute(){ Sound.muted = !Sound.muted; if (!Sound.muted) { Sound.ensure(); Sound.pop(); } renderTopbar(); }

$("#pauseBtn").onclick = togglePause;
$("#muteBtn").onclick = toggleMute;
$("#restartBtn").onclick = openConfirm;
$("#skipBtn").onclick = () => { if (S.stage === "s1" && !S.s1.checked) { S.s1.checked = true; S.s1.skipped = true; return goStage("s2"); } advance(); };

/* ================= BOOT ================= */
$("#world").innerHTML = sceneSVG();
S = freshState();
fit(); window.addEventListener("resize", fit);
goStage("intro");
})();
</script>

</body>
